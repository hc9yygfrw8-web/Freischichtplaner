<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6c6c66;--bd:#dedad2;--pos:#17803f;--neg:#c23a3a;--ft:#d9822b;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#212120;--tx:#ecebe6;--mut:#a09f98;--bd:#38382f;--pos:#4cc380;--neg:#ef7676;--ft:#e8a05a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--card:#212120;--tx:#ecebe6;--mut:#a09f98;--bd:#38382f;--pos:#4cc380;--neg:#ef7676;--ft:#e8a05a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:640px;margin-inline:auto}
h1{font-size:19px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--mut)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.note{font-size:13px;margin-top:8px}.warn{color:var(--neg)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.nav strong{flex:1;text-align:center}
button{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}.modes small{color:var(--mut);width:100%}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:11px;color:var(--mut)}
.cell{min-height:60px;border-radius:7px;border:1px solid var(--bd);border-top:4px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--card));padding:2px 3px;font-size:11px;position:relative;cursor:pointer;user-select:none;overflow:hidden}
.cell.out{opacity:.4}.cell.today{box-shadow:0 0 0 2px var(--tx)}
.cell b{font-size:13px}.cell .sh{position:absolute;top:2px;right:4px;color:var(--mut)}
.cell .bal{position:absolute;bottom:2px;left:3px;font-weight:600}
.cell.wk{border-top-color:var(--bd);background:var(--bg);color:var(--mut)}
.cell.ft{border-top-color:var(--ft);background:color-mix(in srgb,var(--ft) 18%,var(--card));color:var(--tx)}
.cell.u{box-shadow:inset 0 0 0 2px var(--pos)}
.cell.f{background:var(--bg);border-top-color:var(--mut)}
.cell.fs{border:2px dashed var(--neg);border-top-width:4px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--neg) 24%,var(--card)) 0 6px,var(--card) 6px 12px);color:var(--tx)}
.cell.fs b{text-decoration:underline}
.tag{position:absolute;bottom:2px;right:3px;font-size:10px;font-weight:700;padding:0 4px;border-radius:4px;color:#fff}
.t-fs{background:var(--neg)}.t-u{background:var(--pos)}.t-f{background:var(--mut)}.t-ft{background:var(--ft)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:8px;color:var(--mut)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hl{font-size:12px;margin-top:6px;color:var(--mut)}
details summary{cursor:pointer;font-weight:600}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.f label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.f input,.f select{font:inherit;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
.f input[type=color]{padding:2px;height:34px}
.full{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap}.row label{flex-direction:row;align-items:center;gap:3px;color:var(--tx);font-size:13px}
.brand{text-align:center;margin:2px 0 12px}.logo{height:34px;width:auto;display:block;margin:0 auto 4px}.brand h1{margin:4px 0 0}.by{font-size:12px;color:var(--mut)}
.adj{position:absolute;top:19px;left:3px;font-size:10px;font-weight:700}
.ap{display:none;margin:0 0 8px;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}.ap.show{display:flex}.ap input,.ap select{font:inherit;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}.ap input{width:70px}
</style></head><body>

<script>
const $=id=>document.getElementById(id),P=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+P(d.getMonth()+1)+"-"+P(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const diff=(a,b)=>Math.round((b-a)/864e5);
const monday=d=>addD(d,-((d.getDay()+6)%7));
const T=new Date(),TK=key(T);
let S={start:TK,bal:0,perDay:1,fsCost:7,days:[1,2,3,4,5],cycle:"3,2,1",refDate:TK,refShift:"3",types:{},colors:{},adj:{},mariae:false};

const save=()=>{try{localStorage.setItem("fsk1",JSON.stringify(S))}catch(e){}};
let view=new Date(T.getFullYear(),T.getMonth(),1),mode="fs",hc={};
const fmt=n=>(Math.round(n*10)/10).toString().replace(".",","),

const cyc=()=>S.cycle.split(",").map(s=>s.trim()).filter(Boolean);
const DEF={"1":"#f2b134","2":"#4a8fd9","3":"#8c63d4"},PAL=["#38aa78","#e0617a","#8b909a"];
const hex=l=>S.colors[l]||DEF[l]||PAL[Math.max(0,cyc().indexOf(l))%3];
function shiftOf(d){const c=cyc(),n=c.length;if(!n)return "";let i=c.indexOf(String(S.refShift).trim());if(i<0)i=0;
 const w=Math.floor(diff(monday(parse(S.refDate)),monday(d))/7);return c[(((i+w)%n)+n)%n]}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
 h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
 t=h+l-7*m+114;return new Date(y,Math.floor(t/31)-1,(t%31)+1)}
function hol(y){if(hc[y])return hc[y];const E=easter(y),o={},a=(d,n)=>{o[key(d)]=n};

 a(new Date(y,4,1),"Tag der Arbeit");a(addD(E,39),"Christi Himmelfahrt");a(addD(E,50),"Pfingstmontag");a(addD(E,60),"Fronleichnam");
 a(new Date(y,7,15),"Mariä Himmelfahrt");a(new Date(y,9,3),"Tag der Deutschen Einheit");a(new Date(y,10,1),"Allerheiligen");
 a(new Date(y,11,25),"1. Weihnachtstag");a(new Date(y,11,26),"2. Weihnachtstag");return hc[y]=o}
const hn=d=>hol(d.getFullYear())[key(d)];
function delta(d){const a=+S.adj[key(d)]||0;if(hn(d))return a;const t=S.types[key(d)];if(t==="fs")return a-S.fsCost;if(t)return a;return a+(S.days.includes(d.getDay())?S.perDay:0)}

 for(let i=0;i<rows*7;i++){const d=addD(gs,i),k=key(d),wk=d.getDay()%6===0,s=wk?"":shiftOf(d),t=S.types[k],f=hn(d),b=ser.get(k);
  const tg=f?"ft":t;
  h+='<div class="cell'+(d.getMonth()!==mo?" out":"")+(k===TK?" today":"")+(wk?" wk":"")+(f?" ft":"")+(t&&!f?" "+t:"")+'" data-k="'+k+'" style="--c:'+(s?hex(s):"var(--bd)")+'"><b>'+d.getDate()+'</b><span class="sh">'+s+"</span>"+(S.adj[k]?'<span class="adj '+(S.adj[k]<0?"neg":"pos")+'">'+(S.adj[k]>0?"+":"")+fmt(S.adj[k])+"</span>":"")+
  (b!==undefined&&!wk?'<span class="bal '+(b<0?"neg":"")+'">'+fmt(b)+"h</span>":"")+
  (tg?'<span class="tag t-'+tg+'">'+{fs:"FS",u:"U",f:"F",ft:"FT"}[tg]+"</span>":"")+"</div>"}
 $("grid").innerHTML=h;
 $("mon").textContent=first.toLocaleDateString("de-DE",{month:"long",year:"numeric"});
 $("leg").innerHTML=[...new Set(cyc())].map(l=>'<span><i style="background:'+hex(l)+'"></i>'+l+". Schicht</span>").join("")+
  '<span><i style="background:var(--bg);border:1px solid var(--bd)"></i>Sa/So</span><span><b class="tag t-fs" style="position:static">FS</b> Freischicht (gestreift)</span><span><b class="tag t-u" style="position:static">U</b> Urlaub</span><span><b class="tag t-ft" style="position:static">FT</b> Feiertag</span><span><b class="tag t-f" style="position:static">F</b> sonstig frei</span>';
 const hs=[];for(let d=first;d<=last;d=addD(d,1)){const n=hn(d);if(n)hs.push(P(d.getDate())+"."+P(mo+1)+". "+n)}
 $("hl").textContent=hs.length?"Feiertage: "+hs.join(" · "):"";
 const now=ser.get(TK),eom=ser.get(key(last)),cl=v=>v===undefined?"":(v<0?"neg":"pos");
 $("stats").innerHTML='<div class="stat"><b class="'+cl(now)+'">'+fmt(now===undefined?S.bal:now)+' h</b><span>Stand heute</span></div>'+
  '<div class="stat"><b class="'+cl(eom)+'">'+(eom===undefined?"–":fmt(eom)+" h")+'</b><span>Ende '+first.toLocaleDateString("de-DE",{month:"short"})+'</span></div>'+
  '<div class="stat"><b>'+Object.values(S.types).filter(x=>x==="fs").length+'</b><span>Freischichten geplant</span></div>';
 let ok=null,neg=null;const from=key(T>parse(S.start)?T:parse(S.start));
 for(const [k,b] of ser){if(!neg&&b<0)neg=k;if(!ok&&k>=from&&b>=S.fsCost)ok=k}
 $("note").innerHTML=""+
  (neg?'<span class="warn">Achtung: Das Konto wird am <b>'+dstr(parse(neg))+"</b> negativ.</span>":"");
}
$("grid").onclick=e=>{const c=e.target.closest(".cell");if(!c)return;const k=c.dataset.k;if(mode==="a"){openAdj(k);return}if(hn(parse(k)))return;
 if(S.types[k]===mode)delete S.types[k];else S.types[k]=mode;save();render()};
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;adjK=null;sync()});
function sync(){document.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));$("ap").classList.toggle("show",mode==="a"&&!!adjK)}
let adjK=null;
function openAdj(k){adjK=k;const v=+S.adj[k]||0;$("apd").textContent=dstr(parse(k));$("apg").value=v>0?"1":"-1";$("apv").value=v?fmt(Math.abs(v)):"";sync()}
$("aps").onclick=()=>{const n=parseFloat($("apv").value.replace(",","."));if(!n)delete S.adj[adjK];else S.adj[adjK]=n*(+$("apg").value);adjK=null;save();sync();render()};
$("apx").onclick=()=>{delete S.adj[adjK];adjK=null;save();sync();render()};
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$("tod").onclick=()=>{view=new Date(T.getFullYear(),T.getMonth(),1);render()};
$("ua").onclick=()=>{const a=$("uf").value,b=$("ut").value||a;if(!a)return;let d=parse(a);const e=parse(b);
 while(d<=e){S.types[key(d)]="u";d=addD(d,1)}save();render()};
const names=[["Mo",1],["Di",2],["Mi",3],["Do",4],["Fr",5],["Sa",6],["So",0]];
$("wd").innerHTML='<span style="font-size:12px;color:var(--mut);width:100%">Arbeitstage (zählen +h):</span>'+names.map(n=>'<label><input type="checkbox" data-d="'+n[1]+'"> '+n[0]+"</label>").join("");
function buildCols(){$("cols").innerHTML='<span style="font-size:12px;color:var(--mut);width:100%">Schichtfarben:</span>'+[...new Set(cyc())].map(l=>'<label>'+l+'. <input type="color" data-c="'+l+'" value="'+hex(l)+'"></label>').join("");
 document.querySelectorAll("[data-c]").forEach(i=>i.oninput=()=>{S.colors[i.dataset.c]=i.value;save();render()})}
["bal","start","perDay","fsCost","cycle","refDate","refShift"].forEach(id=>{const el=$(id);el.value=S[id];
 el.onchange=()=>{let v=el.value;if(["bal","perDay","fsCost"].includes(id))v=parseFloat(v)||0;if(["start","refDate"].includes(id)&&!v)return;S[id]=v;save();if(id==="cycle")buildCols();render()}});
document.querySelectorAll("[data-d]").forEach(c=>{c.checked=S.days.includes(+c.dataset.d);
 c.onchange=()=>{S.days=[...document.querySelectorAll("[data-d]")].filter(x=>x.checked).map(x=>+x.dataset.d);save();render()}});
function applyFt(){if(S.ftColor)document.documentElement.style.setProperty("--ft",S.ftColor)}
$("ftc").value=S.ftColor||"#d9822b";$("ftc").oninput=e=>{S.ftColor=e.target.value;applyFt();save()};applyFt();
buildCols();sync();render();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}})</script></body></html>
